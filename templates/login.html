<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Career Recommendation System</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F3F0FF 0%, #E0E7FF 100%);
      padding: 20px;
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .demo-accounts-box {
      margin-top: 24px;
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 12px;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo-icon">
        <i data-lucide="compass"></i>
      </div>
      <div class="brand-title">Career<span>WithinU</span></div>
    </div>

    <h2 style="font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 6px; color: #1E293B;">Welcome Back</h2>
    <p style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 24px;">
      Sign in to explore your personalized career recommendations.
    </p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert-box alert-error" style="font-size: 13px; padding: 10px 14px;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label" style="font-size: 13px; font-weight: 700;">Username or Email</label>
        <input type="text" name="username" id="auth-username" class="form-control" placeholder="rahul or rahul@example.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" style="font-size: 13px; font-weight: 700;">Password</label>
        <input type="password" name="password" id="auth-password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 15px;">
        Sign In →
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary);">
      Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 700;">Create one here</a>
    </div>

    <!-- Quick Demo Logins -->
    <div class="demo-accounts-box">
      <strong>⚡ Quick Demo Credentials:</strong>
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button type="button" class="btn btn-outline" style="flex: 1; font-size: 11px; padding: 6px;" onclick="fillDemo('rahul', 'password123')">
          Demo Student (Rahul)
        </button>
        <button type="button" class="btn btn-outline" style="flex: 1; font-size: 11px; padding: 6px;" onclick="fillDemo('admin', 'admin123')">
          Administrator
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    function fillDemo(user, pass) {
      document.getElementById('auth-username').value = user;
      document.getElementById('auth-password').value = pass;
    }
  </script>
</body>
</html>
