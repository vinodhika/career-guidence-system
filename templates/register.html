<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Career Recommendation System</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F3F0FF 0%, #E0E7FF 100%);
      padding: 20px;
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 460px;
      padding: 36px 32px;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo-icon">
        <i data-lucide="compass"></i>
      </div>
      <div class="brand-title">Career<span>WithinU</span></div>
    </div>

    <h2 style="font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 6px; color: #1E293B;">Get Started</h2>
    <p style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 24px;">
      Create an account to discover careers aligned with your skills & interests.
    </p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert-box alert-error" style="font-size: 13px; padding: 10px 14px;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom: 14px;">
        <label class="form-label" style="font-size: 13px; font-weight: 700;">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Rahul Sharma" required>
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <label class="form-label" style="font-size: 13px; font-weight: 700;">Username</label>
        <input type="text" name="username" class="form-control" placeholder="rahul26" required>
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <label class="form-label" style="font-size: 13px; font-weight: 700;">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="rahul@example.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <label class="form-label" style="font-size: 13px; font-weight: 700;">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" style="font-size: 13px; font-weight: 700;">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; font-size: 15px;">
        Create Account & Setup Profile →
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary);">
      Already have an account? <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 700;">Sign in here</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
